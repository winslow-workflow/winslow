[project]
name = "winslow-sample-filter-plugin"
version = "0.1.0"
description = "Sample Winslow plugin: one filter command"
requires-python = ">=3.12"
dependencies = ["winslow"]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[project.entry-points."winslow.filter_plugins"]
winslow-sample-filter-plugin = "winslow_sample_filter_plugin"
